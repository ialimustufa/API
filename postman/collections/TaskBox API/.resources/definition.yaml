scripts:
  - type: http:afterResponse
    code: |-
      pm.test('Response time is under 2 seconds', function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      const status = pm.response.code;
      if (status !== 204) {
        pm.test('Response has a JSON content type', function () {
          pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/(json|problem\+json)/i);
        });
      }
      if (status >= 400 && (pm.response.headers.get('Content-Type') || '').includes('application/problem+json')) {
        pm.test('Problem response follows the TaskBox problem shape', function () {
          const body = pm.response.json();
          pm.expect(body).to.include.all.keys('type', 'title', 'status', 'detail', 'instance', 'code');
          pm.expect(body.status).to.eql(status);
          pm.expect(body.type).to.match(/\/problems\//);
          pm.expect(body.type.endsWith('/problems/' + body.code)).to.be.true;
        });
      }
    language: text/javascript
