openapi: 3.1.0
info:
  title: Hello API
  version: 1.0.0
paths:
  /api/v1/hello:
    get:
      summary: Return a greeting
      responses:
        '200':
          description: Greeting returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
              example: {message: Hello, API engineer!}
  /api/v1/echo:
    post:
      summary: Echo a message
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EchoRequest'}
      responses:
        '200':
          description: Message echoed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EchoResponse'}
        '400':
          description: Malformed or invalid JSON
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  schemas:
    EchoRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: {type: string, minLength: 1, maxLength: 200}
    HelloResponse:
      type: object
      required: [message]
      properties: {message: {type: string}}
    EchoResponse:
      type: object
      required: [message]
      properties: {message: {type: string}}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
