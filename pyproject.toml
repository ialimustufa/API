[project]
name = "taskbox-api-course"
version = "0.1.0"
description = "TaskBox API engineering course and reference implementation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
# These examples are retained for the course but are not needed by the
# production TaskBox application or its container image.
legacy = ["flask>=3.1,<4"]
persistence-labs = ["sqlalchemy>=2.0,<3"]

[dependency-groups]
dev = [
  "flask>=3.1,<4",
  "hatchling>=1.32,<2",
  "pyyaml>=6,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "sqlalchemy>=2.0,<3",
  "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["course/labs/**/starter/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"legacy/fixed_flask_api/app.py" = ["UP047"]
"src/taskbox/adapters/sqlite.py" = ["E501"]
"src/taskbox/domain/__init__.py" = ["F403"]
"src/taskbox/ports/__init__.py" = ["F403"]
